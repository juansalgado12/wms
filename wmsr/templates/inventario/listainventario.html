{% extends 'layouts/base.html' %}

{% block title %}Inventario - Warehouse Management System{% endblock %}
{% block content %}
<div class="container w-full h-screen bg-cover size-full px-4 py-6">
  <div class="mb-4">
    <h1 class="text-3xl font-bold text-slate-800 mb-4 dark:text-white">Listado de inventario</h1>
    <p class="text-slate-600 dark:text-gray-300">Administra tu inventario desde aquí. Al igual que las ubicaciones.</p>
  </div>

  <div class="flex flex-wrap gap-4 mb-8">
    <a href="{{url_for('inventario.crear_inventario')}}"
      class="bg-transparent text-green-500 font-semibold hover:text-white py-2 px-4 border border-green-500 hover:border-white rounded">Crear
      inventario</a>

    <div class="relative inline-block text-left">
      <a href="{{url_for('ubicaciones.lista_ubicaciones')}}" class="bg-transparent text-blue-700 font-semibold hover:text-white py-2 px-4 border border-blue-500 hover:border-white rounded flex items-center"
        id="dropdownButton">Gestionar ubicaciones</a>
    </div>
  </div> <!-- Cerrado: contenedor de botones -->

  {% endblock %}
