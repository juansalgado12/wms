{% extends 'layouts/base.html' %}
{% block title %}Lista de Proveedores{% endblock %}

{% block content %}
<div class="mb-8">
	<h1 class="text-3xl font-bold text-slate-800 mb-2 dark:text-white">Lista de Ubicaciones</h1>
	<p class="text-slate-600 dark:text-gray-300">Administra las ubicaciones que serán asignadas en los inventarios.</p>
</div>

<div class="flex flex-wrap gap-4 mb-8">
    <a href="{{url_for('inventario.lista_inventario')}}" class="bg-transparent text-white font-semibold hover:text-gray-400 py-2 px-4 border border-white hover:border-gray-400 rounded">Volver</a>
	<a href="{{url_for('ubicaciones.crear_ubicacion')}}" class="bg-transparent text-green-500 font-semibold hover:text-white py-2 px-4 border border-green-500 hover:border-white rounded">Crear ubicación</a>
</div>

{% endblock %}
