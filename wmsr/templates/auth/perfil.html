{% extends 'layouts/base.html' %}

{% block title %}Perfil de Usuario{% endblock %}

{% block content %}
<form method="POST" action="" class="max-w-md mx-auto bg-gray-800 text-gray-200 p-8 rounded-lg shadow-lg space-y-6 border border-gray-700">
    <h1 class="text-center text-lg font-medium text-white">Editar Perfil</h1>
    <div>
        <label for="nombre" class="block text-gray-300 font-semibold mb-2">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ user.usu_nombre }}" required
            class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-700 text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-green-400">
    </div>
    <div>
        <label for="email" class="block text-gray-300 font-semibold mb-2">Email:</label>
        <input type="email" id="email" name="email" value="{{ user.usu_email }}" readonly
            class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-gray-400 cursor-not-allowed">
    </div>
    <div>
        <label for="password" class="block text-gray-300 font-semibold mb-2">Nueva contraseña:</label>
        <input type="password" id="password" name="password"
            class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-700 text-gray-100 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-green-400 focus:border-green-400">
    </div>
    <div>
        <label for="rol" class="block text-gray-300 font-semibold mb-2">Rol:</label>
        <input type="text" id="rol" name="rol" value="{{ user.usu_rol }}" readonly
            class="w-full px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-gray-400 cursor-not-allowed">
    </div>
    <div class="flex gap-4">
                    <a href="{{url_for('home.almacen')}}"
                        class="flex-1 py-3 bg-transparent text-white font-semibold text-red-500 dark:text-red-500 hover:text-white border border-red-500 flex justify-center hover:border-white rounded">Cancelar
                    </a>
                    <button type="submit"
                        class="flex-1 py-3 text-white font-semibold bg-transparent text-green-500 dark:text-green-500 hover:text-white border border-green-500 hover:border-white rounded">
                        Editar perfil
                    </button>
                </div>
</form>
{% endblock %}
