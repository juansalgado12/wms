{% extends 'layouts/base.html' %}

{% block title %}Perfil de Usuario{% endblock %}

{% block content %}
<form method="POST" action="" class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-lg space-y-6">
    <h1 class="text-center text-lg font-medium">Editar Perfil</h1>
    <div>
        <label for="nombre" class="block text-gray-700 font-semibold mb-2">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ user.usu_nombre }}" required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div>
        <label for="email" class="block text-gray-700 font-semibold mb-2">Email:</label>
        <input type="email" id="email" name="email" value="{{ user.usu_email }}" readonly
            class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed">
    </div>
    <div>
        <label for="password" class="block text-gray-700 font-semibold mb-2">Nueva contraseña:</label>
        <input type="password" id="password" name="password"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
    </div>
    <div>
        <label for="rol" class="block text-gray-700 font-semibold mb-2">Rol:</label>
        <input type="text" id="rol" name="rol" value="{{ user.usu_rol }}" readonly
            class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed">
    </div>
    <div class="flex justify-between items-center pt-4">
        <a href="{{url_for('home.almacen')}}"
            class="px-6 py-2 bg-red-600 text-white font-semibold rounded-lg hover:bg-red-800 transition-all shadow-md hover:shadow-lg">
            Cancelar
        </a>
        <button type="submit"
            class="px-6 py-2 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-800 transition-all shadow-md hover:shadow-lg">
            Guardar cambios
        </button>
    </div>
</form>
{% endblock %}
