{% extends 'layouts/base_public.html' %}

{% block title %}Inicio de sesión - Warehouse Management System{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] py-12">
    <div class="w-full max-w-md bg-white rounded-xl shadow-lg p-8 border border-slate-100">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center">Iniciar sesión</h2>
        <form method="POST" action="">
            <!-- Aquí van los campos del formulario de inicio de sesión -->
            <div class="mb-4">
                <label for="email" class="block text-slate-700 font-medium mb-2">Correo electrónico</label>
                <input type="email" id="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>
            <div class="mb-4">
                <label for="password" class="block text-slate-700 font-medium mb-2">Contraseña</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-green-400">
            </div>
            <button type="submit" class="w-full py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-800 transition-all shadow-md hover:shadow-lg">Iniciar sesión</button>
        </form>
        <p class="mt-6 text-center text-slate-600">¿No tienes cuenta todavía? <a href="{{url_for('auth.registro')}}" class="text-green-600 hover:underline">Regístrate</a></p>
    </div>

    <div class="flex gap-4 justify-center pt-12">
        <a href="{{url_for('home.index')}}"
            class="px-8 py-4 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-800 transition-all shadow-lg hover:shadow-xl flex items-center gap-2 group">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="transform scale-x-[-1] group-hover:-translate-x-1 transition-transform">
                <path d="M5 12h14"></path>
                <path d="m12 5 7 7-7 7"></path>
            </svg>
            Volver a pagina Principal
        </a>
    </div>
</div>
{% endblock %}
