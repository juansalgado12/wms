{% extends 'layouts/base.html' %}

{% block title %}Editar Movimiento - Warehouse Management System{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] py-12">
    <div class="w-full max-w-xl rounded-xl shadow-lg p-8 border border-slate-700 bg-slate-800">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center dark:text-white">Editar movimiento</h2>
        <form method="POST" action="{{ url_for('movimientos.editar_movimiento', mov_id=movimiento.mov_id) }}" class="space-y-4">
            <div>
                <label for="producto" class="block text-slate-200 font-medium mb-2">Producto</label>
                <select id="producto" name="producto" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 cursor-pointer">
                    <option value="{{movimiento.mov_pro_codigo}}" selected>Seleccione un producto</option>
                    {% for p in productos %}
                        <option value="{{ p.pro_codigo }}" {% if p.pro_codigo == movimiento.mov_pro_codigo %}selected{% endif %}>{{ p.pro_nombre }} ({{ p.pro_codigo }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="cantidad" class="block text-slate-200 font-medium mb-2">Cantidad</label>
                <input id="cantidad" name="cantidad" type="number" value="{{ movimiento.mov_cantidad}}" min="1" placeholder="Cantidad del movimiento" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="documento" class="block text-slate-200 font-medium mb-2">Documento de recibo (ID)</label>
                <select id="documento" name="documento" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 cursor-pointer">
                    <option value="" selected>Seleccione un documento</option>
                    {% for d in documentos | reverse %}
                        <option value="{{ d.doc_id }}" {% if d.doc_id == movimiento.mov_doc_id %}selected{% endif %}>{{ d.doc_id }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label for="tipo" class="block text-slate-200 font-medium mb-2">Tipo de movimiento</label>
                <select id="tipo" name="tipo" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 cursor-pointer">
                    <option value="" selected>Seleccione tipo</option>
                    <option value="INGRESO" {% if movimiento.mov_tipo == 'INGRESO' %}selected{% endif %}>INGRESO</option>
                    <option value="SALIDA" {% if movimiento.mov_tipo == 'SALIDA' %}selected{% endif %}>SALIDA</option>
                </select>
            </div>

            <div>
                <label for="destino" class="block text-slate-200 font-medium mb-2">Destino (opcional)</label>
                <input id="destino" name="destino" type="text" value="{{ movimiento.mov_destino }}" placeholder="Destino del movimiento (opcional)"
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="inventario" class="block text-slate-200 font-medium mb-2">ID de inventario (ubicación — producto)</label>
                <select id="inventario" name="inventario" disabled aria-disabled="true" tabindex="-1"
                    class="w-full px-4 py-2 bg-slate-700 text-slate-400 border border-slate-600 rounded-lg placeholder-slate-400 focus:outline-none cursor-not-allowed opacity-70">
                    <option value="" selected>Seleccione un inventario</option>
                    {% for inv in inventarios %}
                        {% set prod = productos_map.get(inv.inv_pro_codigo) if productos_map is defined else None %}
                        {% set ubi = ubicaciones_map.get(inv.inv_cod_ubicacion) if ubicaciones_map is defined else None %}
                        <option value="{{ inv.inv_id }}" {% if inv.inv_id == movimiento.mov_inv_id %}selected{% endif %}>
                            {{ inv.inv_id }} — {{ prod.pro_nombre if prod else inv.inv_pro_codigo }} Ubicación: {{ ubi.ubi_codigo if ubi else inv.inv_cod_ubicacion }}
                        </option>
                    {% endfor %}
                </select>
                <input type="hidden" name="inventario" value="{{ movimiento.mov_inv_id }}">
            </div>

            <div>
                <label for="observaciones" class="block text-slate-200 font-medium mb-2">Observaciones</label>
                <textarea id="observaciones" name="observaciones" placeholder="Observaciones del movimiento (opcional)"
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">{{ movimiento.mov_observaciones }}</textarea>
            </div>

                <div class="flex gap-4">
                    <a href="{{url_for('movimientos.lista_movimientos')}}"
                        class="flex-1 py-3 bg-transparent text-white font-semibold text-red-500 dark:text-red-500 hover:text-white border border-red-500 flex justify-center hover:border-white rounded">Cancelar
                    </a>
                    <button type="submit"
                        class="flex-1 py-3 text-white font-semibold bg-transparent text-green-500 dark:text-green-500 hover:text-white border border-green-500 hover:border-white rounded cursor-pointer">
                        Editar movimiento
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
