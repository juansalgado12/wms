{% extends 'layouts/base.html' %}

{% block title %}Realizar Movimiento - Warehouse Management System{% endblock %}
{% block content %}
<div class="flex flex-col items-center justify-center min-h-[60vh] py-12">
    <div class="w-full max-w-xl rounded-xl shadow-lg p-8 border border-slate-700 bg-slate-800">
        <h2 class="text-2xl font-bold text-slate-800 mb-6 text-center dark:text-white">Realizar movimiento</h2>
        <form method="POST" action="{{ url_for('movimientos.realizar_movimiento') }}" class="space-y-4">
            <div>
                <label for="producto" class="block text-slate-200 font-medium mb-2">Producto (código) — mostrar nombre</label>
                <select id="producto" name="producto" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="" selected>Seleccione un producto</option>
                    {% for p in productos %}
                        <option value="{{ p.pro_codigo }}">{{ p.pro_nombre }} ({{ p.pro_codigo }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="cantidad" class="block text-slate-200 font-medium mb-2">Cantidad</label>
                <input id="cantidad" name="cantidad" type="number" min="1" placeholder="Cantidad del movimiento" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="documento" class="block text-slate-200 font-medium mb-2">Documento de recibo (ID)</label>
                <select id="documento" name="documento" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="" selected>Seleccione un documento</option>
                    {% for d in documentos %}
                        <option value="{{ d.doc_id }}">{{ d.doc_id }}{% if d.doc_descripcion %} — {{ d.doc_descripcion }}{% endif %}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="tipo" class="block text-slate-200 font-medium mb-2">Tipo de movimiento</label>
                <select id="tipo" name="tipo" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="" selected>Seleccione tipo</option>
                    <option value="INGRESO">INGRESO</option>
                    <option value="SALIDA">SALIDA</option>
                </select>
            </div>

            <div>
                <label for="destino" class="block text-slate-200 font-medium mb-2">Destino (opcional)</label>
                <input id="destino" name="destino" type="text" placeholder="Destino del movimiento (opcional)"
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
            </div>

            <div>
                <label for="inventario" class="block text-slate-200 font-medium mb-2">ID de inventario (ubicación — producto)</label>
                <select id="inventario" name="inventario_id" required
                    class="w-full px-4 py-2 bg-slate-800 text-slate-100 border border-slate-700 rounded-lg placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="" selected>Seleccione un inventario</option>
                    {% for inv in inventarios %}
                        {% set prod = productos_map.get(inv.inv_pro_codigo) if productos_map is defined else None %}
                        {% set ubi = ubicaciones_map.get(inv.inv_cod_ubicacion) if ubicaciones_map is defined else None %}
                        <option value="{{ inv.inv_id }}">
                            {{ inv.inv_id }} — {{ prod.pro_nombre if prod else inv.inv_pro_codigo }} @ {{ ubi.ubi_codigo if ubi else inv.inv_cod_ubicacion }}
                        </option>
                    {% endfor %}
                </select>
            </div>

                <button type="submit"
                    class="w-full py-3 text-white font-semibold bg-transparent text-green-500 dark:text-green-500 hover:text-white border border-green-500 hover:border-white rounded">
                    Realizar movimiento
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
