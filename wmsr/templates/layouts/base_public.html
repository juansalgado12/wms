<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Warehouse Management System{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-slate-100">
    <!-- Navegación -->
    <nav class="px-6 py-4 bg-white/80 backdrop-blur-sm border-b border-slate-200">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <a href="{{ url_for('home.index') }}">
                    <img src="{{ url_for('static', filename='img/logo_uceva.png') }}" alt="logo" width="75" height="75">
                </a>
                <span class="text-2xl font-bold text-slate-800">Warehouse Management System</span>
            </div>
            <div class="flex gap-3">
                <a href="{{url_for('auth.login')}}" class="px-5 py-2 text-slate-700 font-medium hover:text-green-600 transition-colors">
                    Iniciar Sesión
                </a>
                <a href="{{url_for('auth.registro')}}" class="px-5 py-2 bg-green-600 text-white font-medium rounded-lg hover:bg-green-800 transition-all shadow-md hover:shadow-lg">
                    Registrarse
                </a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="mt-24 py-8 border-t border-slate-200">
        <div class="max-w-7xl mx-auto px-6 text-center text-slate-600">
            <p>© 2025 Warehouse Management System. Optimiza tu almacén hoy, no esperes más.</p>
        </div>
    </footer>
</body>
</html>
